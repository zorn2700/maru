<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102A43">
  <meta name="description" content="Офлайн-курс египетского арабского для русскоговорящих">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Masri RU">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Masri RU</title>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="brandButton" class="brand" type="button" aria-label="На главную">
        <span class="brand-mark" aria-hidden="true">م</span>
        <span><strong>Masri RU</strong><small>Египетский арабский</small></span>
      </button>
      <div class="top-actions">
        <button id="searchButton" class="icon-button" type="button" aria-label="Поиск" title="Поиск">⌕</button>
        <button id="installButton" class="pill-button hidden" type="button">Установить</button>
      </div>
    </header>

    <main id="main" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button type="button" data-route="home"><span aria-hidden="true">⌂</span><small>Главная</small></button>
      <button type="button" data-route="course"><span aria-hidden="true">▤</span><small>Курс</small></button>
      <button type="button" data-route="practice"><span aria-hidden="true">◇</span><small>Практика</small></button>
      <button type="button" data-route="media"><span aria-hidden="true">▶</span><small>Видео</small></button>
      <button type="button" data-route="settings"><span aria-hidden="true">⚙</span><small>Настройки</small></button>
    </nav>
  </div>

  <dialog id="searchDialog" class="sheet-dialog">
    <form method="dialog" class="dialog-head">
      <label for="searchInput">Поиск по курсу</label>
      <button class="icon-button" value="close" aria-label="Закрыть">×</button>
    </form>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Русское или арабское слово">
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <dialog id="mediaDialog" class="media-dialog">
    <form method="dialog" class="dialog-head media-head">
      <strong id="mediaDialogTitle">Видео</strong>
      <button class="icon-button" value="close" aria-label="Закрыть">×</button>
    </form>
    <video id="lessonVideo" controls playsinline preload="metadata"></video>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
